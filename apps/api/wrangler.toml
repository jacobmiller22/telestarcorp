name = "telestarcorp-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"

[vars]
NODE_ENV = "production"
ENVIRONMENT = "production"
API_URL = "https://telestarcorp.com"
FLAG_MAINTENANCE_MODE = "false"
FLAG_EMERGENCY_KILL_SWITCH = "false"
FLAG_VERBOSE_DEBUG_HEADERS = "false"
FLAG_ENABLE_BETA_FEATURES = "false"

[env.staging]
name = "telestarcorp-api-staging"
routes = [
  { pattern = "staging.telestarcorp.com/*", zone_name = "telestarcorp.com" }
]

[env.staging.vars]
NODE_ENV = "staging"
ENVIRONMENT = "staging"
API_URL = "https://staging.telestarcorp.com"
FLAG_MAINTENANCE_MODE = "false"
FLAG_EMERGENCY_KILL_SWITCH = "false"
FLAG_VERBOSE_DEBUG_HEADERS = "true"
FLAG_ENABLE_BETA_FEATURES = "true"

[env.production]
name = "telestarcorp-api-production"
routes = [
  { pattern = "telestarcorp.com/*", zone_name = "telestarcorp.com" },
  { pattern = "www.telestarcorp.com/*", zone_name = "telestarcorp.com" }
]

[env.production.vars]
NODE_ENV = "production"
ENVIRONMENT = "production"
API_URL = "https://telestarcorp.com"
FLAG_MAINTENANCE_MODE = "false"
FLAG_EMERGENCY_KILL_SWITCH = "false"
FLAG_VERBOSE_DEBUG_HEADERS = "false"
FLAG_ENABLE_BETA_FEATURES = "false"

[env.preview]
name = "telestarcorp-api-preview"
routes = [
  { pattern = "pr-*.telestarcorp.com/*", zone_name = "telestarcorp.com" }
]

[env.preview.vars]
NODE_ENV = "preview"
ENVIRONMENT = "preview"
API_URL = "https://preview.telestarcorp.com"
FLAG_MAINTENANCE_MODE = "false"
FLAG_EMERGENCY_KILL_SWITCH = "false"
FLAG_VERBOSE_DEBUG_HEADERS = "true"
FLAG_ENABLE_BETA_FEATURES = "true"
