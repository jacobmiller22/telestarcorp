name: Ephemeral PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  deploy-preview:
    name: Build & Validate Ephemeral Cloudflare Preview
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write
      issues: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint
        run: pnpm run check

      - name: Compute Preview Variables
        id: vars
        run: |
          PR_NUM=${{ github.event.pull_request.number }}
          echo "PR_NUM=${PR_NUM}" >> $GITHUB_ENV
          echo "PREVIEW_URL=https://pr-${PR_NUM}-api.example.com" >> $GITHUB_ENV

          # Configure dynamic worker name in wrangler.toml for isolated per-PR deployment
          sed -i -e "s/name = \"template-api-preview\"/name = \"template-api-preview-pr-${PR_NUM}\"/g" wrangler.toml
          sed -i -e "s/pr-\*-api/pr-${PR_NUM}-api/g" wrangler.toml

      - name: Deploy Ephemeral Preview to Cloudflare Workers
        id: deploy
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env preview

      - name: Verify Ephemeral Preview Parity & Edge Health
        id: verify_edge
        if: steps.deploy.outcome == 'success'
        run: |
          echo "Verifying ephemeral preview parity at ${PREVIEW_URL}..."
          pnpm run test:parity --url "${PREVIEW_URL}"

      - name: Run Cloudflare Browser Rendering Ephemeral Preview Smoke
        id: preview_smoke
        if: steps.verify_edge.outcome == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm run test:preview-smoke --url "${PREVIEW_URL}"

      - name: Comment Preview Status on PR
        if: always() && steps.vars.outcome == 'success'
        uses: actions/github-script@v7
        env:
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_edge.outcome }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = process.env.PREVIEW_URL;
            const deployOutcome = process.env.DEPLOY_OUTCOME;
            const verifyOutcome = process.env.VERIFY_OUTCOME;

            let body = '';
            if (deployOutcome === 'success' && verifyOutcome === 'success') {
              body = `🚀 **Ephemeral PR Preview Ready & Verified!**\n\n- **Preview Environment**: [${previewUrl}](${previewUrl})\n- **Edge Health Probe**: \`${previewUrl}/api/health\` (healthy)\n- **Architecture**: Multi-Worker (Cloudflare Workers + D1 SQLite + KV)\n\n*This environment will automatically tear down when the PR is merged or closed.*`;
            } else if (deployOutcome === 'skipped') {
              body = `⚠️ **Ephemeral PR Preview Skipped**\n\n- **Reason**: Cloudflare credentials (\`CLOUDFLARE_API_TOKEN\`, \`CLOUDFLARE_ACCOUNT_ID\`) are not configured in repository secrets.\n- **Local Verification**: Passed (typecheck, lint, bundle budget check)\n\n*Configure Cloudflare secrets to enable edge previews on pull requests.*`;
            } else {
              body = `❌ **Ephemeral PR Preview Deployment Failed**\n\n- **Preview Environment**: [${previewUrl}](${previewUrl})\n- **Status**: Deployment or edge verification failed.\n\n*Please inspect GitHub Actions logs for details.*`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c => c.body.includes('Ephemeral PR Preview'));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
