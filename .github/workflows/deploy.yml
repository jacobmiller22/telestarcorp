name: Cloudflare Workers CI/CD Deployment

on:
  push:
    branches:
      - staging
      - production
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build & Validate Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck & Lint
        run: pnpm run check

      - name: Worker Bundle Budget Gate
        run: pnpm run check:bundle

  deploy-staging:
    name: Deploy to Staging Edge
    runs-on: ubuntu-latest
    needs: [build-and-validate]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 Migrations to Staging
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          pnpm run d1:migrate --remote --env staging || true

      - name: Deploy to Cloudflare Workers (Staging)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env staging

  test-staging:
    name: Verify Staging Edge Parity
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Staging Edge Parity Probe
        run: |
          STAGING_URL="${{ secrets.STAGING_API_URL || 'https://telestarcorp-staging.jacobmillerdev.workers.dev' }}"
          echo "Probing staging edge health at ${STAGING_URL}..."
          pnpm run test:parity --url "${STAGING_URL}" || true

  deploy-production:
    name: Deploy to Production Edge (Gated)
    runs-on: ubuntu-latest
    needs: [build-and-validate, deploy-staging, test-staging]
    if: github.ref == 'refs/heads/production' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply D1 Migrations to Production
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: |
          pnpm run d1:migrate --remote --env production || true

      - name: Deploy to Cloudflare Workers (Production)
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production

  verify-production:
    name: Verify Production Edge Health
    runs-on: ubuntu-latest
    needs: [deploy-production]

    steps:
      - name: Production Edge Health Probe
        run: |
          PROD_URL="${{ secrets.PRODUCTION_API_URL || 'https://telestarcorp.jacobmiller22.com' }}"
          echo "Probing production health at ${PROD_URL}/api/health..."
          curl -s -f "${PROD_URL}/api/health" || true

  notify-deployment:
    name: Dispatch Deployment Notification
    runs-on: ubuntu-latest
    needs: [build-and-validate, deploy-staging, test-staging, deploy-production, verify-production]
    if: always()
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL || secrets.DISCORD_WEBHOOK_DEV_ALERTS }}
    steps:
      - name: Dispatch Discord Alert
        if: env.DISCORD_WEBHOOK != ''
        run: |
          STATUS="SUCCESS"
          if [ "${{ needs.build-and-validate.result }}" != "success" ]; then
            STATUS="FAILURE"
          fi
          curl -s -X POST -H "Content-Type: application/json" \
            -d "{\"content\": \"🚀 **[Deployment]** Continuous deployment completed with status: ${STATUS}\"}" \
            "${DISCORD_WEBHOOK}" || true
