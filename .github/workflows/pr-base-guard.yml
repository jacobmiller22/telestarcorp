name: PR Base Branch Guard

on:
  pull_request_target:
    types: [opened, edited]
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  retarget-to-staging:
    name: Auto-Retarget PR to Staging
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'
    steps:
      - name: Retarget PR to staging
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const headRef = context.payload.pull_request.head.ref;
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            console.log(`PR #${prNumber} from '${headRef}' targeted 'main'. Retargeting to 'staging'...`);

            await github.rest.pulls.update({
              owner: repoOwner,
              repo: repoName,
              pull_number: prNumber,
              base: 'staging'
            });

            const commentBody = `⚠️ **Notice: Base Branch Automatically Retargeted to \`staging\`**\n\n` +
              `Pull requests targeting \`main\` are prohibited. This project uses a two-stage **\`staging\` ➔ \`production\`** branch workflow.\n\n` +
              `- **\`staging\`**: Default branch and active integration target.\n` +
              `- **\`production\`**: Protected live release branch, promoted exclusively from \`staging\`.\n\n` +
              `This pull request has been automatically retargeted to **\`staging\`**.`;

            await github.rest.issues.createComment({
              owner: repoOwner,
              repo: repoName,
              issue_number: prNumber,
              body: commentBody
            });
